<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
SITE INTRO
========================= -->

<header id="intro">

    <h1 id="siteTitle"></h1>

    <p id="siteDescription"></p>

</header>


<!-- =========================
MAIN GALLERY
========================= -->

<main id="galleryContainer">

    <section id="gallery">


        <!-- ===================
        ARTWORK 1
        ==================== -->

        <article class="artwork" data-project="project1">

            <img
                src="images/art1.jpg"
                alt="Artwork 1"
                class="galleryImage">

            <h2 contenteditable="true">
                Title One
            </h2>

            <p contenteditable="true">
                Short description goes here.
            </p>

        </article>


        <!-- ===================
        ARTWORK 2
        ==================== -->

        <article class="artwork" data-project="project2">

            <img
                src="images/art2.jpg"
                alt="Artwork 2"
                class="galleryImage">

            <h2 contenteditable="true">
                Title Two
            </h2>

            <p contenteditable="true">
                Short description.
            </p>

        </article>



        <!-- ===================
        ARTWORK 3
        ==================== -->

        <article class="artwork" data-project="project3">

            <img
                src="images/art3.jpg"
                alt="Artwork 3"
                class="galleryImage">

            <h2 contenteditable="true">
                Title Three
            </h2>

            <p contenteditable="true">
                Description.
            </p>

        </article>



        <!-- ===================
        ARTWORK 4
        ==================== -->

        <article class="artwork" data-project="project4">

            <img
                src="images/art4.jpg"
                alt="Artwork 4"
                class="galleryImage">

            <h2 contenteditable="true">
                Title Four
            </h2>

            <p contenteditable="true">
                Description.
            </p>

        </article>



        <!-- ===================
        ARTWORK 5
        ==================== -->

        <article class="artwork" data-project="project5">

            <img
                src="images/art5.jpg"
                alt="Artwork 5"
                class="galleryImage">

            <h2 contenteditable="true">
                Title Five
            </h2>

            <p contenteditable="true">
                Description.
            </p>

        </article>


    </section>

</main>





<!-- ==================================
DETAIL PAGE
=================================== -->

<section id="projectView" class="hidden">

    <button id="backButton">

        ← Back

    </button>



    <aside id="leftColumn">

        <img
            id="projectImage"
            src=""
            alt="">


        <h2
            id="projectTitle"
            contenteditable="true">
        </h2>


        <p
            id="projectDescription"
            contenteditable="true">
        </p>

    </aside>



    <section id="rightColumn">

        <div id="artboards">


            <!-- BOARD -->

            <div class="board">

                <h3 contenteditable="true">
                    Board One
                </h3>

                <p contenteditable="true">
                    Information
                </p>

            </div>



            <div class="board">

                <h3 contenteditable="true">
                    Board Two
                </h3>

                <p contenteditable="true">
                    Information
                </p>

            </div>



            <button id="addBoard">

                + Add Board

            </button>

        </div>

    </section>

</section>






<!-- =========================
BUTTONS
========================= -->

<button id="addArtwork">

    +

</button>





<script src="script.js"></script>

</body>
</html>
