<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Art Portfolio</title>
  <style>
    :root {
      --bg: #000;
      --text: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.58);
      --line: rgba(255, 255, 255, 0.14);
      --soft: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    img {
      display: block;
      width: 100%;
    }

    button, input, textarea {
      font: inherit;
    }

    ::selection {
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    .shell {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 20px 10px;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      max-width: min(55ch, 78vw);
    }

    .brand small {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      font-weight: 600;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .controls {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
    }

    .link-btn {
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 10px 0;
      opacity: 0.9;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .link-btn:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .add-btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.32);
    }

    .view {
      width: 100vw;
      height: 100vh;
    }

    .hidden { display: none !important; }

    .gallery-wrap {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.22) transparent;
      scroll-snap-type: x proximity;
      padding: 92px 18px 22px;
    }

    .gallery {
      display: flex;
      flex-wrap: nowrap;
      gap: 18px;
      align-items: flex-start;
      min-width: max-content;
      height: calc(100vh - 114px);
    }

    .card {
      width: min(34vw, 330px);
      min-width: 280px;
      flex: 0 0 auto;
      scroll-snap-align: start;
      cursor: pointer;
      transform: translateZ(0);
      transition: transform 0.5s ease, filter 0.5s ease, opacity 0.5s ease;
    }

    .card-inner {
      display: grid;
      gap: 10px;
    }

    .square {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: transparent;
    }

    .square img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease, filter 0.5s ease;
      filter: saturate(1.02);
    }

    .card.hovered {
      transform: scale(1.035);
      z-index: 5;
    }

    .card.hovered .square img {
      transform: scale(1.04);
    }

    .card.dimmed {
      opacity: 0.84;
      filter: blur(1.6px) brightness(0.85);
    }

    .text-space {
      display: grid;
      gap: 8px;
    }

    .text-space input,
    .text-space textarea,
    .detail-input,
    .detail-textarea {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 10px 0;
      outline: none;
      border-radius: 0;
      transition: transform 0.5s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .text-space input,
    .detail-input {
      font-size: 1rem;
      font-weight: 500;
    }

    .text-space textarea,
    .detail-textarea {
      min-height: 88px;
      resize: none;
      color: rgba(245,245,247,0.78);
      line-height: 1.45;
    }

    .card.hovered .text-space input,
    .card.hovered .text-space textarea {
      transform: scale(1.02);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      padding: 0;
      opacity: 0.75;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .icon-btn:hover {
      opacity: 1;
      transform: scale(1.08);
    }

    .detail-wrap {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: grid;
      grid-template-columns: 25vw 75vw;
      overflow: hidden;
      padding-top: 68px;
    }

    .detail-left {
      height: calc(100vh - 68px);
      padding: 20px 18px 20px 18px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .detail-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: transparent;
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-right {
      background: #000;
    }

    .detail-note {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
      margin-top: 4px;
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .detail-top .label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.24em;
      font-size: 0.72rem;
    }

    .board-list {
      display: grid;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .card {
        width: 300px;
      }

      .detail-wrap {
        grid-template-columns: 1fr;
      }

      .detail-right {
        display: none;
      }

      .detail-left {
        width: 100vw;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <small>Art portfolio</small>
        <h1 id="siteTitle">Your Name / Work</h1>
        <p id="siteSubtitle">Horizontal gallery, hover focus, and a blank black detail page.</p>
      </div>
      <div class="controls">
        <button class="link-btn hidden" id="galleryBackBtn" type="button">Gallery</button>
        <button class="add-btn" id="addCardBtn" type="button">+ Add card</button>
      </div>
    </header>

    <section id="galleryView" class="view">
      <div class="gallery-wrap" id="galleryWrap">
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <section id="detailView" class="view hidden">
      <div class="detail-wrap">
        <div class="detail-left">
          <div class="detail-top">
            <div class="label">Selected work</div>
            <button class="link-btn" id="backBtn" type="button">← Back</button>
          </div>

          <div class="detail-image">
            <img id="detailImage" src="" alt="Selected artwork" />
          </div>

          <input class="detail-input" id="detailTitle" type="text" />
          <textarea class="detail-textarea" id="detailDescription"></textarea>
          <p class="detail-note">This left column is the only visible content on the page. The rest stays black.</p>
        </div>
        <div class="detail-right"></div>
      </div>
    </section>
  </div>

  <script>
    const seedArtworks = [
      {
        id: 1,
        title: "Piece One",
        description: "Short text about this work. Medium, date, concept, or any note you want.",
        image: "https://images.unsplash.com/photo-1547891654-e66ed7ebb968?auto=format&fit=crop&w=1400&q=80"
      },
      {
        id: 2,
        title: "Piece Two",
        description: "Another short caption area for the piece.",
        image: "https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=1400&q=80"
      },
      {
        id: 3,
        title: "Piece Three",
        description: "Caption text below the square image.",
        image: "https://images.unsplash.com/photo-1494337480532-372d2d3c7a26?auto=format&fit=crop&w=1400&q=80"
      },
      {
        id: 4,
        title: "Piece Four",
        description: "Use this for a small note, like medium or series name.",
        image: "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1400&q=80"
      },
      {
        id: 5,
        title: "Piece Five",
        description: "A fifth square card with space for text under it.",
        image: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1400&q=80"
      }
    ];

    let artworks = JSON.parse(JSON.stringify(seedArtworks));
    let hoveredId = null;
    let selectedId = artworks[0].id;
    let view = "gallery";

    const galleryView = document.getElementById("galleryView");
    const detailView = document.getElementById("detailView");
    const gallery = document.getElementById("gallery");
    const galleryWrap = document.getElementById("galleryWrap");
    const detailImage = document.getElementById("detailImage");
    const detailTitle = document.getElementById("detailTitle");
    const detailDescription = document.getElementById("detailDescription");
    const backBtn = document.getElementById("backBtn");
    const galleryBackBtn = document.getElementById("galleryBackBtn");
    const addCardBtn = document.getElementById("addCardBtn");

    function cloneCard(id) {
      return {
        id,
        title: `New Piece ${id}`,
        description: "Add your own caption here.",
        image: "https://images.unsplash.com/photo-1504198453319-5ce911bafcde?auto=format&fit=crop&w=1400&q=80"
      };
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replaceAll("\n", " ");
    }

    function renderGallery() {
      gallery.innerHTML = artworks.map((art) => {
        const isHovered = hoveredId === art.id;
        const isDimmed = hoveredId && hoveredId !== art.id;
        return `
          <article class="card ${isHovered ? 'hovered' : ''} ${isDimmed ? 'dimmed' : ''}" data-id="${art.id}">
            <div class="card-inner">
              <div class="square">
                <img src="${art.image}" alt="${escapeHtml(art.title)}" />
              </div>
              <div class="text-space">
                <input type="text" value="${escapeAttr(art.title)}" data-title-id="${art.id}" />
                <textarea data-desc-id="${art.id}">${escapeHtml(art.description)}</textarea>
              </div>
              <div class="meta-row">
                <span>click to open</span>
                <button class="icon-btn" type="button" data-delete-id="${art.id}" aria-label="Delete card">×</button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      bindGalleryEvents();
    }

    function renderDetail() {
      const art = artworks.find((item) => item.id === selectedId) || artworks[0];
      if (!art) return;
      detailImage.src = art.image;
      detailTitle.value = art.title;
      detailDescription.value = art.description;
      galleryBackBtn.classList.remove("hidden");
    }

    function showGallery() {
      view = "gallery";
      hoveredId = null;
      detailView.classList.add("hidden");
      galleryView.classList.remove("hidden");
      galleryBackBtn.classList.add("hidden");
      renderGallery();
    }

    function showDetail(id) {
      selectedId = id;
      view = "detail";
      detailView.classList.remove("hidden");
      galleryView.classList.add("hidden");
      renderDetail();
    }

    function updateArtwork(id, patch) {
      artworks = artworks.map((art) => art.id === id ? { ...art, ...patch } : art);
      if (view === "gallery") renderGallery();
      if (view === "detail") renderDetail();
    }

    function removeArtwork(id) {
      artworks = artworks.filter((art) => art.id !== id);
      if (!artworks.length) artworks = [cloneCard(1)];
      if (selectedId === id) selectedId = artworks[0].id;
      if (view === "gallery") renderGallery();
      if (view === "detail") renderDetail();
    }

    function addArtwork() {
      const nextId = artworks.length ? Math.max(...artworks.map((a) => a.id)) + 1 : 1;
      artworks.push(cloneCard(nextId));
      selectedId = nextId;
      if (view === "gallery") renderGallery();
      if (view === "detail") renderDetail();
    }

    function bindGalleryEvents() {
      document.querySelectorAll(".card").forEach((card) => {
        const id = Number(card.getAttribute("data-id"));

        card.addEventListener("mousemove", (e) => {
          const closest = e.target.closest(".card");
          if (closest) {
            const hovered = Number(closest.getAttribute("data-id"));
            if (hoveredId !== hovered) {
              hoveredId = hovered;
              renderGallery();
            }
          } else if (hoveredId !== null) {
            hoveredId = null;
            renderGallery();
          }
        });

        card.addEventListener("mouseleave", () => {
          hoveredId = null;
          renderGallery();
        });

        card.addEventListener("click", (e) => {
          if (e.target.matches("input, textarea, button")) return;
          showDetail(id);
        });
      });

      document.querySelectorAll("[data-title-id]").forEach((input) => {
        input.addEventListener("input", (e) => {
          const id = Number(e.target.getAttribute("data-title-id"));
          updateArtwork(id, { title: e.target.value });
        });
      });

      document.querySelectorAll("[data-desc-id]").forEach((textarea) => {
        textarea.addEventListener("input", (e) => {
          const id = Number(e.target.getAttribute("data-desc-id"));
          updateArtwork(id, { description: e.target.value });
        });
      });

      document.querySelectorAll("[data-delete-id]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = Number(btn.getAttribute("data-delete-id"));
          removeArtwork(id);
        });
      });
    }

    backBtn.addEventListener("click", showGallery);
    galleryBackBtn.addEventListener("click", showGallery);
    addCardBtn.addEventListener("click", addArtwork);

    detailTitle.addEventListener("input", () => updateArtwork(selectedId, { title: detailTitle.value }));
    detailDescription.addEventListener("input", () => updateArtwork(selectedId, { description: detailDescription.value }));

    galleryWrap.addEventListener("mousemove", (e) => {
      const card = e.target.closest(".card");
      if (!card) {
        if (hoveredId !== null) {
          hoveredId = null;
          renderGallery();
        }
      }
    });

    renderGallery();
  </script>
</body>
</html>
