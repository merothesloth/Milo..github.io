<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Art Portfolio</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
EDITOR TOOLBAR
========================= -->


<div id="toolbar">


<button id="editToggle">
EDIT
</button>


<button id="undoButton">
UNDO
</button>


<button id="redoButton">
REDO
</button>


<button id="saveButton">
SAVE
</button>



<button id="addText">
ADD TEXT
</button>


<button id="addImage">
ADD IMAGE
</button>


<button id="addArtboard">
ADD ARTBOARD
</button>



<div id="controls">


<label>
Font Size
<input 
id="fontSize"
type="number"
value="48">
</label>



<label>
Color
<input
id="textColor"
type="color"
value="#ffffff">
</label>


<select id="fontSelector">

<option>
Default
</option>

<option>
Serif
</option>

<option>
Sans Serif
</option>

<option>
Monospace
</option>

</select>


</div>


</div>





<!-- =========================
MAIN CANVAS
========================= -->


<main id="canvas">



<!-- STARTING TITLE -->

<div 
class="object textObject"
data-type="text">


<h1 contenteditable="true">

My Art Portfolio

</h1>


</div>





<div 
class="object textObject"
data-type="text">


<p contenteditable="true">

A collection of my work

</p>


</div>





<!-- STARTING ARTWORK -->

<div 
class="object imageObject"
data-type="image">


<img 
src="images/art1.jpg"
alt="Artwork">


</div>





<div 
class="object imageObject"
data-type="image">


<img 
src="images/art2.jpg"
alt="Artwork">


</div>





<div 
class="object imageObject"
data-type="image">


<img 
src="images/art3.jpg"
alt="Artwork">


</div>





</main>





<!-- =========================
HIDDEN UPLOAD
========================= -->


<input 
id="imageUpload"
type="file"
accept="image/*"
hidden>





<script src="editor.js"></script>


</body>


</html>
